# plunge's release build. Upstream's .goreleaser.yml is left as is so upstream merges stay clean.
#
# Differences from upstream:
# - The CLI binary is `plunge`, built from pkg/cmd/pulumi (the Go package path is upstream's).
# - Two versions are stamped: plunge's own (PLUNGE_VERSION) and the Pulumi-compatible one
#   (PULUMI_VERSION) that SDKs and plugins check. scripts/plunge-version.sh prints both.
# - Language hosts keep their protocol names (pulumi-language-*), since the engine and SDKs look
#   them up by those names.
# - No Windows signing hook (it needs pulumi's signing credentials) and no display wasm.
#
# Bundling matches upstream's tarball: ./scripts/prep-for-goreleaser.sh fills bin/<os>-<arch>/ with
# the dotnet and yaml hosts pinned in scripts/get-language-providers.sh, and the archives below pick
# them up. Java and HCL are not bundled; the CLI installs them on first use at the versions pinned in
# pkg/util/plugin.go (knownLanguageRuntimes).
#
#   ./scripts/prep-for-goreleaser.sh
#   PULUMI_VERSION=$(./scripts/plunge-version.sh pulumi) PLUNGE_VERSION=$(./scripts/plunge-version.sh plunge) \
#     goreleaser release -f .goreleaser.plunge.yml
dist: goreleaser
version: 2

project_name: plunge

builds:
- &plungebin
  id: plunge
  binary: plunge
  dir: pkg
  main: ./cmd/pulumi
  env:
  - GO111MODULE=on
  goos: ['linux', 'darwin', 'windows']
  goarch: ['amd64', 'arm64']
  goamd64: ['v1']
  flags:
    - -trimpath
  ldflags:
    - -w -s
    - -X github.com/pulumi/pulumi/sdk/v3/go/common/version.Version=v{{.Env.PULUMI_VERSION}}
    - -X github.com/pulumi/pulumi/pkg/v3/plunge.Version=v{{.Env.PLUNGE_VERSION}}
  mod_timestamp: '{{ .CommitTimestamp }}'
  tags:
    - osusergo
    - grpcnotrace
- <<: *plungebin
  id: pulumi-language-go
  binary: pulumi-language-go
  dir: sdk/go/pulumi-language-go
  main: ./
- <<: *plungebin
  id: pulumi-language-nodejs
  binary: pulumi-language-nodejs
  dir: sdk/nodejs/cmd/pulumi-language-nodejs
  main: ./
- <<: *plungebin
  id: pulumi-language-bun
  binary: pulumi-language-bun
  dir: sdk/nodejs/cmd/pulumi-language-bun
  main: ./
- <<: *plungebin
  id: pulumi-language-python
  binary: pulumi-language-python
  dir: sdk/python/cmd/pulumi-language-python
  main: ./
- <<: *plungebin
  id: pulumi-language-pcl
  binary: pulumi-language-pcl
  dir: sdk/pcl
  main: ./cmd/pulumi-language-pcl

archives:
- id: plunge
  wrap_in_directory: plunge{{ if eq .Os "windows" }}/bin{{ end }}
  format_overrides:
    - goos: windows
      formats: zip
  files:
      # OS specific scripts, not compiled
    - src: bin/{{ .Os }}/*
      dst: '.'
      strip_parent: true
      # bundled language hosts (dotnet, yaml) fetched by scripts/get-language-providers.sh
    - src: 'bin/{{ .Os }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}/*'
      dst: '.'
      strip_parent: true
  name_template: '{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}'

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT"

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"
