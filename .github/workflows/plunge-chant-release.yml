# Generated by chant — do not edit directly. Regenerate with: chant release workflow --forge github (in the workspace root)
name: chant release
on:
  workflow_dispatch:
    inputs:
      label:
        description: The release's label, such as v1.4.0, or auto for the one chant release next computes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chant-release
  cancel-in-progress: false
env:
  CHANT_RELEASE_LABEL: ${{ inputs.label }}
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.green.outputs.commit }}
      label: ${{ steps.green.outputs.label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - id: green
        run: |
          commit="$GITHUB_SHA"
          label="$CHANT_RELEASE_LABEL"; if [ "$label" = auto ]; then rc=0; git ls-remote --exit-code --heads origin chant/lifecycle >/dev/null || rc=$?; if [ "$rc" = 0 ]; then git fetch origin chant/lifecycle:chant/lifecycle; elif [ "$rc" != 2 ]; then exit "$rc"; fi; next="$(npx --yes @intentius/chant@0.124.105 release next --at "$commit" --json)" || { echo "release next found no label for $commit, so no release is cut: $next" >&2; exit 1; }; label="$(printf '%s' "$next" | node -e 'const f=process.argv[1];const t=f?require("fs").readFileSync(f,"utf8"):require("fs").readFileSync(0,"utf8");const d=JSON.parse(t);process.stdout.write(String(d.label??""))')"; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
  cut:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      statuses: read
    env:
      CHANT_RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
      CHANT_RELEASE_LABEL: ${{ needs.gate.outputs.label }}
      CHANT_RELEASE_GIT_TOKEN: ${{ github.token }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.${{ github.server_url }}.helper
      GIT_CONFIG_VALUE_0: "!f() { test \"$1\" = get && echo username=x-access-token && echo \"password=$CHANT_RELEASE_GIT_TOKEN\"; }; f"
      GITHUB_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "pkg/go.mod"
          cache-dependency-path: "pkg/go.sum\nsdk/go.sum\n"
      - run: "echo \"PULUMI_VERSION=$(./scripts/plunge-version.sh pulumi)\" >> \"$GITHUB_ENV\""
      - run: "./scripts/prep-for-goreleaser.sh"
      - run: npx --yes @intentius/chant@0.124.105 release doctor --from cut
      - name: goreleaser v2.19.0
        run: "mkdir -p \"$RUNNER_TEMP/goreleaser\" && curl -fsSL -o \"$RUNNER_TEMP/goreleaser/goreleaser.tar.gz\" https://github.com/goreleaser/goreleaser/releases/download/v2.19.0/goreleaser_Linux_x86_64.tar.gz && echo \"ebc3194ad1d1b1787614405285a0039665cd4c5bd3305215a1b201600f90630b  $RUNNER_TEMP/goreleaser/goreleaser.tar.gz\" | sha256sum -c - && tar -xzf \"$RUNNER_TEMP/goreleaser/goreleaser.tar.gz\" -C \"$RUNNER_TEMP/goreleaser\" goreleaser && echo \"CHANT_GORELEASER=$RUNNER_TEMP/goreleaser/goreleaser\" >> \"$GITHUB_ENV\""
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - run: rc=0; git ls-remote --exit-code --heads origin chant/lifecycle >/dev/null || rc=$?; if [ "$rc" = 0 ]; then git fetch origin chant/lifecycle:chant/lifecycle; elif [ "$rc" != 2 ]; then exit "$rc"; fi
      - run: |
          git config user.name "chant release"
          git config user.email "chant-release@localhost"
          npx --yes @intentius/chant@0.124.105 release cut "$CHANT_RELEASE_LABEL" --at "$CHANT_RELEASE_COMMIT" --yes --json > "$RUNNER_TEMP/chant-cut.json"
          tag="$(node -e 'const f=process.argv[1];const t=f?require("fs").readFileSync(f,"utf8"):require("fs").readFileSync(0,"utf8");const d=JSON.parse(t);process.stdout.write(String(d.tag?.name??""))' "$RUNNER_TEMP/chant-cut.json")"
          if [ -n "$tag" ]; then git push origin "refs/tags/$tag"; fi
      - run: npx --yes @intentius/chant@0.124.105 release artifacts "$CHANT_RELEASE_LABEL" --no-build -o "$RUNNER_TEMP/chant-release-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chant-release-artifacts
          path: ${{ runner.temp }}/chant-release-artifacts
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [gate, cut]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      checks: read
      statuses: read
    env:
      CHANT_RELEASE_LABEL: ${{ needs.gate.outputs.label }}
      GITHUB_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "pkg/go.mod"
          cache-dependency-path: "pkg/go.sum\nsdk/go.sum\n"
      - run: "echo \"PULUMI_VERSION=$(./scripts/plunge-version.sh pulumi)\" >> \"$GITHUB_ENV\""
      - run: "./scripts/prep-for-goreleaser.sh"
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - run: git fetch origin chant/lifecycle:chant/lifecycle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chant-release-artifacts
          path: ${{ runner.temp }}/chant-release-artifacts
      - run: npx --yes @intentius/chant@0.124.105 release artifacts "$CHANT_RELEASE_LABEL" --from "$RUNNER_TEMP/chant-release-artifacts"
      - run: npx --yes @intentius/chant@0.124.105 release publish "$CHANT_RELEASE_LABEL" --yes
